name: Build Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release to put the files on (e.g. v2.0.1; made as a draft if it isn't there). Empty = run artifacts only.
        required: false
        default: ''
      ref:
        description: Branch to build (a test branch; releases come from main).
        required: false
        default: main

# Write: the full Android APK can come from a draft release, which a read-only token can't see.
permissions:
  contents: write

jobs:
  build:
    # x64 and arm64: each on a runner of its own architecture, so the C helper (linux-helper) and
    # the bundled adb are native. ARM64 / Raspberry Pi / Apple-silicon VMs take the arm64 one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.arch }})

    steps:
      # main unless another branch is asked for (ref), whichever branch the run was started from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxext-dev \
            libxrandr-dev \
            libxfixes-dev \
            libglib2.0-dev

      # Google ships Linux platform-tools for x64 only, so the arm64 packages carry the
      # distribution's own adb (AOSP, Apache-2.0) built for arm64 instead.
      - name: Bundled adb (arm64)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y adb
          mkdir -p linux/vendor/adb
          install -m 755 "$(command -v adb)" linux/vendor/adb/adb
          file linux/vendor/adb/adb || true

      - uses: ./.github/actions/android-full
        with:
          keystore: ${{ secrets.ANDROID_KEYSTORE }}

      - name: Install dependencies
        working-directory: linux
        run: npm install

      - name: Build Linux packages
        working-directory: linux
        env:
          TD_ARCH: ${{ matrix.arch }}
        run: npm run dist

      - name: Show what was built
        run: ls -la linux/dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: twindesk-linux-${{ matrix.arch }}
          path: linux/dist/TwinDesk-*

      # Straight onto the release, no download and re-upload.
      - name: Upload to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || gh release create "${{ inputs.tag }}" --draft --target main --title "${{ inputs.tag }}" --notes "" || true
          gh release upload "${{ inputs.tag }}" linux/dist/TwinDesk-*.AppImage linux/dist/TwinDesk-*.deb --clobber
